spring:
  application:
    name: sakar-cloud-backend

  datasource:
    url: ${SAKAR_DB_URL:jdbc:postgresql://localhost:5432/sakar_cloud}
    username: ${SAKAR_DB_USERNAME:sakar}
    password: ${SAKAR_DB_PASSWORD:sakar}
    hikari:
      maximum-pool-size: ${SAKAR_DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${SAKAR_REDIS_HOST:localhost}
      port: ${SAKAR_REDIS_PORT:6379}
      password: ${SAKAR_REDIS_PASSWORD:}

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SAKAR_SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

sakar:
  bootstrap:
    admin-enabled: ${SAKAR_BOOTSTRAP_ADMIN:false}
    admin-email: ${SAKAR_BOOTSTRAP_ADMIN_EMAIL:admin@sakarrobotics.com}
    # Never given a literal default here — unset means "generate + log a random
    # password" (see DevAdminSeeder). Set SAKAR_BOOTSTRAP_ADMIN_PASSWORD in your
    # own local shell/untracked env file to use a known password instead.
    admin-password: ${SAKAR_BOOTSTRAP_ADMIN_PASSWORD:}

  security:
    jwt:
      # NEVER a real production secret in source. Overridden via SAKAR_JWT_SECRET
      # env var / secret manager in every deployed environment (Part 26).
      secret: ${SAKAR_JWT_SECRET:dev-only-insecure-secret-change-me-dev-only-insecure-secret}
      issuer: sakar-cloud-backend
      access-token-ttl-seconds: ${SAKAR_JWT_ACCESS_TTL:900}
      refresh-token-ttl-seconds: ${SAKAR_JWT_REFRESH_TTL:1209600}
    login:
      max-attempts: 5
      lockout-window-seconds: 900
      lockout-duration-seconds: 900
    step-up:
      ttl-seconds: 300

  command:
    default-expiration-seconds: 45

  commands:
    # Roadmap Phase 6/7 "Robot Agent Command Loop" — resolves commands the
    # agent never reported a result for before they expired. Same
    # gated-scheduled-sweep convention as sakar.alerts below.
    expiry-sweep:
      enabled: ${SAKAR_COMMAND_EXPIRY_SWEEP_ENABLED:true}
      interval-ms: ${SAKAR_COMMAND_EXPIRY_SWEEP_INTERVAL_MS:15000}

  alerts:
    # Roadmap Phase 6: gates only RobotOfflineWatcherService's scheduled
    # sweep (the wall-clock-driven half of alert generation). The
    # battery-threshold rule fires inline on real telemetry ingest and is
    # not gated by this flag — there is no background job to race in tests.
    enabled: ${SAKAR_ALERTS_ENABLED:true}
    offline-threshold-seconds: ${SAKAR_ALERTS_OFFLINE_THRESHOLD_SECONDS:300}
    offline-check-interval-ms: ${SAKAR_ALERTS_OFFLINE_CHECK_INTERVAL_MS:60000}

  integration:
    keenon:
      # Current tested integration path is KEENON-CLOUD DEPENDENT (Master
      # Requirements Part 10/40). Credentials are never hardcoded and never
      # committed; supplied only via environment / secrets manager.
      enabled: ${SAKAR_KEENON_ENABLED:false}
      base-url: ${SAKAR_KEENON_BASE_URL:https://cloud.robotkeenon.com}
      client-id: ${SAKAR_KEENON_CLIENT_ID:}
      client-secret: ${SAKAR_KEENON_CLIENT_SECRET:}
      connect-timeout-ms: 5000
      read-timeout-ms: 8000
      status-sync:
        # "Robot state synchronization foundation" slice — polls the already-real
        # getStatus()/getBattery() adapter calls for KEENON_CLOUD robots and feeds
        # RobotStatusService, the same table MQTT heartbeats already populate for
        # agent-based robots. Disabled by default (unlike alerts/commands sweeps,
        # which default true) because this makes real outbound Keenon HTTP calls
        # and must stay opt-in until a deployment has real Keenon credentials.
        enabled: ${SAKAR_KEENON_STATUS_SYNC_ENABLED:false}
        interval-ms: ${SAKAR_KEENON_STATUS_SYNC_INTERVAL_MS:120000}
      area-sync:
        # Periodically refreshes ALREADY-established KeenonAreaMapping rows — never
        # invents a storeId; it only re-syncs (robot, storeId) pairs this system has
        # already recorded from a prior explicit sync via
        # POST /robots/{id}/keenon/areas/sync. A robot with no existing mapping is
        # never touched by this scheduler (no automatic way to learn its storeId).
        # Areas change far less often than status/battery, so this defaults to a
        # much longer interval. Disabled by default for the same reason as status-sync.
        enabled: ${SAKAR_KEENON_AREA_SYNC_ENABLED:false}
        interval-ms: ${SAKAR_KEENON_AREA_SYNC_INTERVAL_MS:21600000}
      cleaning-mode-sync:
        # Refreshes keenon_cleaning_mode_mappings from GET .../strategy/clean/model.
        # Unlike area-sync, no per-robot bootstrap value is required (robotSn alone
        # is enough), so this iterates every eligible KEENON_CLOUD robot directly,
        # gated on the existing CLEANING capability. Modes change rarely, so this
        # defaults to the same long interval as area-sync. Disabled by default for
        # the same reason as status-sync/area-sync.
        enabled: ${SAKAR_KEENON_CLEANING_MODE_SYNC_ENABLED:false}
        interval-ms: ${SAKAR_KEENON_CLEANING_MODE_SYNC_INTERVAL_MS:21600000}
      back-point-sync:
        # Refreshes keenon_back_point_mappings from GET .../strategy/back/point.
        # Same shape as cleaning-mode-sync: robotSn alone is enough, so this
        # iterates every eligible KEENON_CLOUD robot directly, gated on the
        # existing RETURN_TO_DOCK capability. Points change rarely, so this
        # defaults to the same long interval as area-sync/cleaning-mode-sync.
        # Disabled by default for the same reason as the other Keenon syncs.
        enabled: ${SAKAR_KEENON_BACK_POINT_SYNC_ENABLED:false}
        interval-ms: ${SAKAR_KEENON_BACK_POINT_SYNC_INTERVAL_MS:21600000}
      cleaning-history-sync:
        # Appends cleaning_sessions rows from GET .../clean/log/list. Unlike the
        # other Keenon syncs this is append-only (history is immutable) and
        # bounded pagination, not a "replace current state" sweep — see
        # KeenonCleaningHistorySyncService's Javadoc for why there is no
        # incremental/since-last-sync mode: no such parameter is documented or
        # evidenced for this endpoint. Reuses the same storeId bootstrap as
        # area-sync (an existing active KeenonAreaMapping), so only already
        # area-synced robots are ever touched. Disabled by default for the same
        # reason as every other Keenon sync.
        enabled: ${SAKAR_KEENON_CLEANING_HISTORY_SYNC_ENABLED:false}
        interval-ms: ${SAKAR_KEENON_CLEANING_HISTORY_SYNC_INTERVAL_MS:21600000}
        page-size: ${SAKAR_KEENON_CLEANING_HISTORY_SYNC_PAGE_SIZE:50}
        max-pages: ${SAKAR_KEENON_CLEANING_HISTORY_SYNC_MAX_PAGES:5}
      map-metadata-sync:
        # Populates the existing (previously schema-only) `maps` table from the
        # sceneCode/sceneName fields already present on the robot-status response
        # — NOT the real Keenon map-image endpoint (GET .../custom/robot/map),
        # which needs an unresolved sceneCode/floorInfo pair and returns real
        # geometry/image data explicitly out of scope for this sync. See
        # KeenonMapMetadataSyncService's Javadoc for the full reasoning. Needs no
        # bootstrap value (robotSn alone is enough), so this iterates every
        # eligible KEENON_CLOUD robot directly, gated on GET_STATUS. Disabled by
        # default for the same reason as every other Keenon sync.
        enabled: ${SAKAR_KEENON_MAP_METADATA_SYNC_ENABLED:false}
        interval-ms: ${SAKAR_KEENON_MAP_METADATA_SYNC_INTERVAL_MS:21600000}
      map-point-sync:
        # Populates map_points from GET .../custom/robot/map/position. Reuses
        # map-metadata-sync to resolve sceneCode; does NOT call the map-image
        # endpoint (GET .../custom/robot/map) at all — see
        # KeenonMapPointSyncService's Javadoc. default-floor-info is the one
        # empirically-observed-working value across every scene tested so far
        # — NOT derived from any verified per-scene mechanism; override per
        # deployment if a robot's actual floor differs. Independently
        # configurable/disabled from GET_MAP capability on purpose — C40 S
        # does not currently grant GET_MAP, so gating on it would leave this
        # permanently inert; this scheduler is gated on GET_STATUS instead,
        # matching map-metadata-sync.
        enabled: ${SAKAR_KEENON_MAP_POINT_SYNC_ENABLED:false}
        interval-ms: ${SAKAR_KEENON_MAP_POINT_SYNC_INTERVAL_MS:21600000}
        default-floor-info: ${SAKAR_KEENON_MAP_POINT_SYNC_DEFAULT_FLOOR_INFO:1}
      map-image-sync:
        # Fetches the raw Keenon map PNG (GET .../custom/robot/map) and stores it
        # under sakar.maps.storage-root — see KeenonMapImageSyncService's Javadoc
        # for the full write-ordering/change-detection design. Only mechanical
        # storage: no PGM/YAML/occupancy-grid conversion happens here or anywhere
        # else yet. default-floor-info mirrors map-point-sync's own (same
        # empirically-observed-working value, not derived from any verified
        # per-scene mechanism) but is kept independently configurable since this
        # is an independently schedulable sync. Independently configurable/
        # disabled from GET_MAP capability on purpose — C40 S does not currently
        # grant GET_MAP, so gating on it would leave this permanently inert; this
        # scheduler is gated on GET_STATUS instead, matching map-metadata-sync/
        # map-point-sync. Disabled by default for the same reason as every other
        # Keenon sync.
        enabled: ${SAKAR_KEENON_MAP_IMAGE_SYNC_ENABLED:false}
        interval-ms: ${SAKAR_KEENON_MAP_IMAGE_SYNC_INTERVAL_MS:21600000}
        default-floor-info: ${SAKAR_KEENON_MAP_IMAGE_SYNC_DEFAULT_FLOOR_INFO:1}
      sync-orchestration:
        # KeenonSyncOrchestrationService — one central, wall-clock-aligned (:00/:15/:30/:45)
        # entry point that calls every category's own syncAll() above (robot status, areas,
        # cleaning modes, back points, cleaning history, map metadata/points/images) in one
        # 15-minute cycle, instead of each category needing its own separately-enabled
        # schedule to achieve the same cadence. Does NOT include robot discovery
        # (KeenonRobotSyncService) — see that class's own Javadoc for why an
        # (organizationId, storeId) pair can never be auto-discovered. Defaults to enabled
        # (unlike every category flag above) because automatic 15-minute sync is the actual
        # requirement this exists to satisfy — the real safety gate remains the top-level
        # `enabled` flag above (no real Keenon credentials = no outbound call is ever
        # attempted, exactly like every other Keenon feature).
        enabled: ${SAKAR_KEENON_SYNC_ORCHESTRATION_ENABLED:true}
        cron: "${SAKAR_KEENON_SYNC_ORCHESTRATION_CRON:0 0,15,30,45 * * * *}"

  maps:
    # Persistent, filesystem-backed storage for raw Keenon map PNGs — see
    # KeenonMapImageSyncService's Javadoc. Path layout is
    # <storage-root>/<robotId>/<mapId>/map.png, built only from Sakar-owned
    # UUIDs. Mounted onto a named Docker volume in docker-compose.yml so the
    # data survives container recreation; the default here is only a
    # sensible local-dev fallback.
    storage-root: ${SAKAR_MAPS_STORAGE_ROOT:./data/maps}

  mqtt:
    # Phase 3: when enabled, the backend actually connects, subscribes to every
    # robot's presence/heartbeat/telemetry/events/errors topic, and ingests them
    # (see MqttSubscriptionManager / MqttInboundMessageService). Still disabled
    # by default — no broker connection is attempted in dev/test unless a
    # deployment explicitly turns this on and a broker is actually reachable.
    enabled: ${SAKAR_MQTT_ENABLED:false}
    broker-url: ${SAKAR_MQTT_BROKER_URL:tcp://localhost:1883}
    client-id-prefix: sakar-cloud-
    username: ${SAKAR_MQTT_USERNAME:}
    password: ${SAKAR_MQTT_PASSWORD:}
    qos: 1
    topic-prefix: ${SAKAR_MQTT_TOPIC_PREFIX:sakar}
    schema-version: "1.0"
    max-timestamp-skew-seconds: ${SAKAR_MQTT_MAX_TIMESTAMP_SKEW_SECONDS:300}
    # Phase 3 Security Hardening.
    max-payload-size-bytes: ${SAKAR_MQTT_MAX_PAYLOAD_SIZE_BYTES:65536}
    rate-limit-max-messages: ${SAKAR_MQTT_RATE_LIMIT_MAX_MESSAGES:120}
    rate-limit-window-seconds: ${SAKAR_MQTT_RATE_LIMIT_WINDOW_SECONDS:60}
    # Only used when broker-url is "ssl://..." and a private/self-signed CA is in play - leave both
    # blank to use the JVM's default (publicly-trusted CA) trust store, which is the secure default
    # Paho already applies to any "ssl://" URL with no code changes required.
    tls-trust-store-path: ${SAKAR_MQTT_TLS_TRUSTSTORE_PATH:}
    tls-trust-store-password: ${SAKAR_MQTT_TLS_TRUSTSTORE_PASSWORD:}

logging:
  level:
    com.sakarrobotics.cloud: INFO
    org.springframework.security: INFO
