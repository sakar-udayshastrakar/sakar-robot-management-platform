# Local development environment only (Master Requirements Part 8/16).
# NOT a production deployment topology — production sits behind a WAF/
# Nginx with the database/broker on a private network with no host port
# exposure (see SAKAR_ROBOT_PLATFORM_ARCHITECTURE.md "Hardened deployment
# view"). All credentials below are development-only defaults.
#
# PostgreSQL is NOT part of this dev stack — this project's local Postgres
# runs as a native Windows PostgreSQL install (localhost:5432, database
# sakar_robot_platform; see backend/README.md "Local development database
# setup"). The `backend` service below reaches it via `host.docker.internal`
# when the fully-containerized workflow is used.

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Raw Keenon map PNGs (KeenonMapImageSyncService) — persistent across
      # container recreation, never bind-mounted to a host path.
      - sakar_maps_data:/app/data/maps
    environment:
      # host.docker.internal reaches the native Windows PostgreSQL install
      # from inside the container — see the note above.
      SAKAR_DB_URL: jdbc:postgresql://host.docker.internal:5432/sakar_robot_platform
      SAKAR_DB_USERNAME: sakar
      SAKAR_DB_PASSWORD: sakar
      SAKAR_REDIS_HOST: redis
      SAKAR_REDIS_PORT: "6379"
      SAKAR_MQTT_ENABLED: "false"
      SAKAR_KEENON_ENABLED: "false"
      SAKAR_MAPS_STORAGE_ROOT: /app/data/maps
      # Real values are supplied only via a deployment secret manager — never here.
      SAKAR_JWT_SECRET: dev-only-do-not-use-in-any-real-environment-change-me
      SAKAR_BOOTSTRAP_ADMIN: "true"

volumes:
  sakar_maps_data:
