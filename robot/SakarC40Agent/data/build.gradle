// Sakar Robotics onboard UI - data layer.
//
// The ONLY new module allowed to depend on :robot (and transitively
// :sdk/:navigation/:charging) - it implements :domain's repository
// interfaces either as a real bridge over C40RobotController (battery,
// charging, navigation status, sensors, diagnostics, map read), or as an
// explicitly-labeled local/simulated implementation (cleaning execution,
// workstation, teach-route recording) where the vendored Peanut SDK has no
// corresponding API - see README.md's compatibility notes. :operator-ui
// never sees this module; it only sees :domain interfaces, wired together
// at runtime via DefaultAppContainer, constructed once in
// SakarC40Application (:app).
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace 'com.sakarrobotics.c40agent.data'
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // JUnit 5 for this module's unit tests (same versions as :robot/build.gradle). No
    // Robolectric: the new architecture-preparation tests are plain Kotlin, no Android runtime
    // needed - see RosRobotAdapterStubTest/NotAvailableMappingRepositoryTest.
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation project(':domain')
    implementation project(':robot')
    implementation project(':sdk')
    implementation project(':telemetry')
    implementation project(':logging')
    implementation project(':diagnostics')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'androidx.core:core-ktx:1.13.1'

    // Local persistence for schedules / consumables / teach-routes / cleaning zones.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Super User PIN + local app settings (no plaintext credentials, no Room needed for
    // small key-value state).
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
