// Sakar Robotics onboard operator UI - Jetpack Compose.
//
// This is the new Sakar-branded touchscreen application (home dashboard,
// cleaning, scheduling, manual drive, teach route, settings, Super User,
// robot debugging, logs, installation/commissioning, map/SLAM UI). It
// depends ONLY on :domain (interfaces + models), never on :data, :robot,
// :sdk, :navigation or :charging directly - it gets real implementations
// at runtime through AppContainerHolder, implemented by SakarC40Application
// (:app). It depends on :ui only to be able to launch the existing
// diagnostic MainActivity from the Super User section (reuse, not
// deletion, of the original diagnostic dashboard).
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.sakarrobotics.c40agent.operatorui'
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation project(':domain')
    implementation project(':ui')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.core:core-ktx:1.13.1'
}
