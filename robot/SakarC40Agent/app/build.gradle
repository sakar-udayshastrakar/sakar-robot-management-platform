apply plugin: 'com.android.application'
// Kotlin-Java interop only: SakarC40Application.java (still plain Java, unmodified in structure)
// now constructs the Kotlin DefaultAppContainer (:data) and implements the Kotlin
// AppContainerHolder interface (:domain). Adding this plugin puts kotlin-stdlib on this
// module's own compile classpath so that interop is a normal, supported cross-language call -
// no existing Java source in this module needs to change language.
apply plugin: 'org.jetbrains.kotlin.android'

// Load local, git-ignored credentials. See secrets.properties.example.
// Falls back to safe empty placeholders so the project still compiles
// without real credentials (required for CI / this diagnostic build) -
// same pattern sdk/build.gradle already uses for the Peanut SDK's own
// AppId/Secret.
def secretsFile = rootProject.file('secrets.properties')
def secrets = new Properties()
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}
def secretOrEmpty = { String key -> secrets.getProperty(key, '') }

android {
    namespace 'com.sakarrobotics.c40agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.sakarrobotics.c40agent"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "0.1.0-poc"

        // Phase 3 (Robot Communication / MQTT). Empty by default: SakarMqttConfigFactory
        // treats a blank broker URL/robot ID as "not configured" and never connects - see
        // its Javadoc and SakarC40Application.
        buildConfigField 'String', 'SAKAR_MQTT_BROKER_URL', "\"${secretOrEmpty('SAKAR_MQTT_BROKER_URL')}\""
        buildConfigField 'String', 'SAKAR_ORGANIZATION_ID', "\"${secretOrEmpty('SAKAR_ORGANIZATION_ID')}\""
        buildConfigField 'String', 'SAKAR_SITE_ID', "\"${secretOrEmpty('SAKAR_SITE_ID')}\""
        buildConfigField 'String', 'SAKAR_ROBOT_ID', "\"${secretOrEmpty('SAKAR_ROBOT_ID')}\""
        buildConfigField 'String', 'SAKAR_AGENT_ID', "\"${secretOrEmpty('SAKAR_AGENT_ID')}\""
        buildConfigField 'String', 'SAKAR_MQTT_USERNAME', "\"${secretOrEmpty('SAKAR_MQTT_USERNAME')}\""
        buildConfigField 'String', 'SAKAR_MQTT_PASSWORD', "\"${secretOrEmpty('SAKAR_MQTT_PASSWORD')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(':sdk')
    implementation project(':robot')
    implementation project(':ui')
    implementation project(':logging')
    implementation project(':api')
    // :robot depends on :telemetry too, but Gradle's `implementation` dependencies aren't
    // transitively exposed - C40TelemetrySnapshotProvider needs RuntimeSnapshot/ConnectionStatus directly.
    implementation project(':telemetry')
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // New Sakar Robotics onboard operator UI (Compose) and its supporting domain/data modules -
    // see domain/build.gradle, data/build.gradle and operator-ui/build.gradle for why each one is
    // shaped the way it is. :app is the only module that references all three of :robot, :data
    // and :operator-ui together, to build the one real DefaultAppContainer.
    implementation project(':domain')
    implementation project(':data')
    implementation project(':operator-ui')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
