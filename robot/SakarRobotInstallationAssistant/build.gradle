// Top-level build file. Tool versions match the conventions of the existing Sakar Android
// projects (AGP 8.5.0, Kotlin 1.9.24, Gradle 8.7) so one local toolchain builds everything, but
// nothing here references or depends on SakarC40Agent.
plugins {
    id 'com.android.application' version '8.5.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.9.24' apply false
}
